
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080817">
<title>DERiiLNAY JJ VIDEO MAKER</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080817;
 color:white;
 font-family:Arial,sans-serif;
 padding:18px;
}
header{text-align:center;padding:20px 0}
.logo{
 font-size:27px;
 font-weight:900;
 letter-spacing:2px;
 background:linear-gradient(90deg,#a855f7,#22d3ee);
 color:transparent;
 background-clip:text;
}
.sub{color:#aaa;font-size:11px;letter-spacing:4px}
.card{
 background:#141426;
 border:1px solid #30304b;
 border-radius:18px;
 padding:16px;
 margin-bottom:15px;
}
h3{font-size:14px;color:#c4a5ff}
button,.upload{
 display:block;
 width:100%;
 padding:14px;
 border:0;
 border-radius:12px;
 background:linear-gradient(90deg,#9333ea,#2563eb);
 color:white;
 font-weight:bold;
 text-align:center;
 margin-top:10px;
}
input[type=file]{width:100%;color:#bbb}
.preview{
 width:100%;
 aspect-ratio:9/16;
 max-height:480px;
 background:#05050b;
 border-radius:14px;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow:hidden;
 position:relative;
}
.preview video,.preview img{
 width:100%;
 height:100%;
 object-fit:contain;
}
#beatFlash{
 position:absolute;
 inset:0;
 background:white;
 opacity:0;
 pointer-events:none;
}
canvas{
 width:100%;
 height:75px;
 background:#080817;
 border-radius:10px;
}
.status{color:#aaa;font-size:12px}
input[type=range]{width:100%}
</style>
</head>

<body>

<header>
 <div class="logo">DERiiLNAY</div>
 <div class="sub">JJ VIDEO MAKER</div>
</header>

<div class="card">
 <h3>01 / MEDIA STUDIO</h3>
 <label class="upload">
  + PILIH FOTO & VIDEO
  <input id="media" type="file"
  accept="image/*,video/*" multiple hidden>
 </label>
 <p class="status" id="mediaInfo">Belum ada media</p>
</div>

<div class="card">
 <h3>02 / MUSIC STUDIO</h3>
 <input id="music" type="file" accept="audio/*">
 <p class="status" id="musicInfo">Belum ada musik</p>
 <canvas id="visualizer"></canvas>
</div>

<div class="card">
 <h3>03 / LIVE PREVIEW</h3>
 <div class="preview" id="preview">
  <span id="placeholder">YOUR JJ VIDEO PREVIEW</span>
  <div id="beatFlash"></div>
 </div>
 <button id="play">▶ PLAY JJ PREVIEW</button>
 <button id="stop">■ STOP</button>
</div>

<div class="card">
 <h3>04 / JJ EFFECTS</h3>
 <label>Beat Sensitivity</label>
 <input id="sensitivity" type="range"
 min="1" max="10" value="5">
 <label>Zoom Intensity</label>
 <input id="zoom" type="range"
 min="1" max="20" value="8">
 <label>Flash Intensity</label>
 <input id="flash" type="range"
 min="1" max="10" value="6">
</div>

<div class="card">
 <h3>05 / EXPORT SETTINGS</h3>
 <p class="status">Format: MP4 (tahap konversi berikutnya)</p>
 <p class="status">Resolution: 720 × 1280</p>
 <p class="status">Duration: 30 seconds</p>
 <button id="export">EXPORT VIDEO (COMING SOON)</button>
 <p class="status" id="exportInfo">
  Editor siap menerima media.
 </p>
</div>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const media=document.getElementById('media');
const music=document.getElementById('music');
const preview=document.getElementById('preview');
const placeholder=document.getElementById('placeholder');
const flash=document.getElementById('beatFlash');
const canvas=document.getElementById('visualizer');
const ctx=canvas.getContext('2d');

let files=[];
let current=0;
let audio=null;
let audioContext=null;
let analyser=null;
let source=null;
let recordDestination=null; 
let frequencyData=null;
let playing=false;
let animation=null;
let startTime=0;
let lastBeat=0;
let lastSwitch=0;
let zoomValue=8;
let renderCanvas=document.createElement('canvas');
renderCanvas.width=720;
renderCanvas.height=1280;

let renderCtx=renderCanvas.getContext('2d');
let renderStream=null;
let renderAnimation=null;
media.onchange=()=>{
 files=Array.from(media.files);
 document.getElementById('mediaInfo').textContent=
 files.length+' media dipilih';
 current=0;
 showMedia();
};

function showMedia(){
 preview.querySelectorAll('img,video').forEach(e=>e.remove());

 if(!files.length)return;

 placeholder.style.display='none';

 const file=files[current%files.length];
 const url=URL.createObjectURL(file);

 if(file.type.startsWith('video/')){
  const v=document.createElement('video');
  v.src=url;
  v.muted=true;
  v.loop=true;
  v.playsInline=true;
  preview.prepend(v);
  if(playing)v.play().catch(()=>{});
 }else{
  const img=document.createElement('img');
  img.src=url;
  preview.prepend(img);
 }
}

music.onchange=()=>{
 if(!music.files.length)return;

 if(audio){
  audio.pause();
  audio.src='';
 }

 audio=new Audio(URL.createObjectURL(music.files[0]));

 document.getElementById('musicInfo').textContent=
 music.files[0].name;
};

async function setupAudio(){
 if(!audio)return false;

 if(!audioContext){
  audioContext=new AudioContext();
  analyser=audioContext.createAnalyser();
  analyser.fftSize=256;

  source=audioContext.createMediaElementSource(audio);

source.connect(analyser);

analyser.connect(audioContext.destination);

recordDestination =
audioContext.createMediaStreamDestination();

analyser.connect(recordDestination);

  frequencyData=new Uint8Array(analyser.frequencyBinCount);
 }

 await audioContext.resume();
 return true;
}

function drawVisualizer(){
 if(!analyser)return;

 analyser.getByteFrequencyData(frequencyData);

 canvas.width=canvas.clientWidth*2;
 canvas.height=canvas.clientHeight*2;

 const w=canvas.width/frequencyData.length;

 for(let i=0;i<frequencyData.length;i++){
  const h=frequencyData[i]/255*canvas.height;

  const gradient=ctx.createLinearGradient(
   0,canvas.height,0,0
  );

  gradient.addColorStop(0,'#2563eb');
  gradient.addColorStop(1,'#d946ef');

  ctx.fillStyle=gradient;
  ctx.fillRect(i*w,canvas.height-h,w*0.65,h);
 }
}

function detectBeat(){
 if(!analyser)return false;

 analyser.getByteFrequencyData(frequencyData);

 let bass=0;
 const count=12;

 for(let i=0;i<count;i++){
  bass+=frequencyData[i];
 }

 bass/=count;

 const sensitivity=
 Number(document.getElementById('sensitivity').value);

 const threshold=155-sensitivity*9;

 const now=performance.now();

 if(bass>threshold && now-lastBeat>220){
  lastBeat=now;
  return true;
 }

 return false;
}

function animate(){
 if(!playing)return;

 const elapsed=(performance.now()-startTime)/1000;

 if(elapsed>=30){
  stop();
  document.getElementById('exportInfo').textContent=
  'Preview 30 detik selesai.';
  return;
 }

 drawVisualizer();

 const beat=detectBeat();

 if(beat){
  const intensity=
  Number(document.getElementById('flash').value)/10;

  flash.style.opacity=intensity;

  preview.style.transform=
  'scale('+(1+zoomValue/100)+')';

  setTimeout(()=>{
   flash.style.opacity=0;
   preview.style.transform='scale(1)';
  },110);
 }

 if(performance.now()-lastSwitch>3500){
  if(files.length){
   current=(current+1)%files.length;
   showMedia();
  }
  lastSwitch=performance.now();
 }

 animation=requestAnimationFrame(animate);
}

async function play(){
 if(!files.length){
  alert('Pilih foto atau video dahulu!');
  return;
 }

 if(!music){
  alert('Pilih musik dahulu!');
  return;
 }

 if(!audio){
  alert('Pilih file musik MP3 dahulu!');
  return;
 }

 stop();

 await setupAudio();

 playing=true;
 startTime=performance.now();
 lastBeat=0;
 lastSwitch=performance.now();

 audio.currentTime=0;
 await audio.play();

 animate();
}

function stop(){
 playing=false;

 if(animation)cancelAnimationFrame(animation);

 if(audio)audio.pause();

 flash.style.opacity=0;
 preview.style.transform='scale(1)';

 preview.querySelectorAll('video').forEach(v=>v.pause());
}

document.getElementById('play').onclick=play;
document.getElementById('stop').onclick=stop;

document.getElementById('zoom').oninput=e=>{
 zoomValue=Number(e.target.value);
};


document.getElementById('export').onclick=async()=>{
 const info=document.getElementById('exportInfo');

 if(!files.length || !audio){
  alert('Pilih foto/video dan musik dahulu!');
  return;
 }

 if(!window.MediaRecorder){
  info.textContent='Browser tidak mendukung perekaman.';
  return;
 }

 info.textContent='Menyiapkan perekaman...';

 try{
  await setupAudio();

  const stream=preview.captureStream(30);
  const tracks=[
   ...stream.getVideoTracks(),
   ...recordDestination.stream.getAudioTracks()
  ];

  const combined=new MediaStream(tracks);

  let mime='video/webm;codecs=vp9,opus';

  if(!MediaRecorder.isTypeSupported(mime)){
   mime='video/webm;codecs=vp8,opus';
  }

  if(!MediaRecorder.isTypeSupported(mime)){
   mime='video/webm';
  }

  const recorder=new MediaRecorder(combined,{
   mimeType:mime
  });

  const chunks=[];

  recorder.ondataavailable=e=>{
   if(e.data.size>0)chunks.push(e.data);
  };

  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:'video/webm'});
   const url=URL.createObjectURL(blob);

   const a=document.createElement('a');
   a.href=url;
   a.download='DERiiLNAY-JJ.webm';
   a.click();

   info.textContent='Video WebM berhasil disimpan!';
   tracks.forEach(t=>t.stop());
  };

  recorder.start();

  await play();

  info.textContent='Sedang merekam video 30 detik...';

  setTimeout(()=>{
   stop();
   recorder.stop();
  },30000);

 }catch(error){
  info.textContent='Gagal: '+error.message;
 }
};


</script>
</body>
</html>
